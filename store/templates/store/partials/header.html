{% url 'store:cart' as cart_url %}

<header class="site-header">
  <div class="header-inner">

    <!-- Left menu -->
    <button class="header-icon header-menu" type="button" aria-label="Open menu">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 7h16M4 12h16M4 17h16"/>
      </svg>
    </button>

    <!-- Center brand -->
    <a href="{% url 'store:user_home' %}" class="brand-center" aria-label="Pallavi Papa Sarees home">
      <strong>Pallavi Papa</strong>
      <small>Collections</small>
    </a>

    <!-- Right cart -->
    <div class="header-actions">
      <a href="{{ cart_url }}" class="header-icon bag-icon" aria-label="Open cart">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6.5 8.5h11l-.7 11H7.2l-.7-11Z"/>
          <path d="M9 8.5V6.8a3 3 0 0 1 6 0v1.7"/>
        </svg>

        <span class="bag-count is-hidden" data-cart-count>0</span>
      </a>
    </div>

  </div>
</header>

<style>
:root {
  --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-serif: Georgia, "Times New Roman", serif;
}

/* =========================
   SITE HEADER - SCOPED ONLY
========================= */

.site-header,
.site-header * {
  box-sizing: border-box;
}

.site-header {
  position: sticky !important;
  top: 0 !important;
  z-index: 1000 !important;
  width: 100% !important;
  min-height: 70px !important;
  background: rgba(255, 250, 247, 0.96) !important;
  backdrop-filter: blur(14px);
  border-bottom: 1px solid rgba(43, 23, 24, 0.10) !important;
  font-family: var(--font-sans) !important;
}

.site-header a {
  color: inherit;
  text-decoration: none;
}

.site-header button {
  font: inherit;
}

.site-header .header-inner {
  position: relative !important;
  width: min(1120px, calc(100% - clamp(22px, 5vw, 54px))) !important;
  min-height: 70px !important;
  margin: 0 auto !important;

  display: flex !important;
  align-items: center !important;
  justify-content: space-between !important;
  gap: 16px !important;
}

/* =========================
   BRAND
========================= */

.site-header .brand-center {
  position: absolute !important;
  left: 50% !important;
  top: 50% !important;
  transform: translate(-50%, -50%) !important;
  min-width: 0 !important;

  display: flex !important;
  flex-direction: column !important;
  align-items: center !important;
  justify-content: center !important;
  line-height: 1 !important;
  text-align: center !important;
}

.site-header .brand-center strong {
  display: block !important;
  color: #32191b !important;
  font-family: var(--font-serif) !important;
  font-size: clamp(21px, 3.6vw, 34px) !important;
  font-weight: 500 !important;
  line-height: 0.88 !important;
  letter-spacing: 0.065em !important;
  text-transform: uppercase !important;
  white-space: nowrap !important;
}

.site-header .brand-center small {
  display: block !important;
  margin-top: clamp(3px, 0.8vw, 5px) !important;
  color: rgba(50, 25, 27, 0.70) !important;
  font-family: var(--font-sans) !important;
  font-size: clamp(7px, 1.15vw, 10px) !important;
  font-weight: 700 !important;
  line-height: 1 !important;
  letter-spacing: 0.46em !important;
  text-transform: uppercase !important;
  transform: translateX(0.22em) !important;
}

/* =========================
   ICONS
========================= */

.site-header .header-actions {
  display: flex !important;
  align-items: center !important;
  gap: 0 !important;
}

.site-header .header-icon {
  position: relative !important;
  width: clamp(32px, 5.5vw, 42px) !important;
  height: clamp(32px, 5.5vw, 42px) !important;
  padding: 0 !important;
  border: 0 !important;
  background: transparent !important;
  color: #32191b !important;
  display: inline-grid !important;
  place-items: center !important;
  cursor: pointer !important;
}

.site-header .header-icon svg {
  width: clamp(23px, 4.2vw, 32px) !important;
  height: clamp(23px, 4.2vw, 32px) !important;
  display: block !important;
  fill: none !important;
  stroke: currentColor !important;
  stroke-width: 1.9 !important;
  stroke-linecap: round !important;
  stroke-linejoin: round !important;
}

.site-header .bag-count {
  position: absolute !important;
  right: -3px !important;
  top: -3px !important;
  min-width: clamp(18px, 3.5vw, 24px) !important;
  height: clamp(18px, 3.5vw, 24px) !important;
  padding: 0 5px !important;
  border-radius: 999px !important;

  display: grid !important;
  place-items: center !important;

  color: #fff8ef !important;
  background: #8f182d !important;
  border: 2px solid #fffaf7 !important;
  font-size: clamp(10px, 2vw, 13px) !important;
  font-weight: 800 !important;
  line-height: 1 !important;
}

.site-header .bag-count.is-hidden {
  display: none !important;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 767px) {
  .site-header {
    min-height: 58px !important;
  }

  .site-header .header-inner {
    width: min(100%, calc(100% - 28px)) !important;
    min-height: 58px !important;
  }

  .site-header .brand-center strong {
    font-size: clamp(21px, 7vw, 29px) !important;
    line-height: 0.88 !important;
    letter-spacing: 0.055em !important;
  }

  .site-header .brand-center small {
    margin-top: 4px !important;
    font-size: 8px !important;
    letter-spacing: 0.40em !important;
    transform: translateX(0.20em) !important;
  }

  .site-header .header-icon {
    width: 34px !important;
    height: 34px !important;
  }

  .site-header .header-icon svg {
    width: 25px !important;
    height: 25px !important;
  }

  .site-header .bag-count {
    right: -3px !important;
    top: -3px !important;
    min-width: 20px !important;
    height: 20px !important;
    font-size: 11px !important;
  }
}

/* =========================
   SMALL PHONES
========================= */

@media (max-width: 380px) {
  .site-header .header-inner {
    width: min(100%, calc(100% - 22px)) !important;
    min-height: 56px !important;
  }

  .site-header .brand-center strong {
    font-size: clamp(19px, 6.6vw, 25px) !important;
    line-height: 0.88 !important;
    letter-spacing: 0.045em !important;
  }

  .site-header .brand-center small {
    margin-top: 3px !important;
    font-size: 7.5px !important;
    letter-spacing: 0.34em !important;
    transform: translateX(0.17em) !important;
  }

  .site-header .header-icon {
    width: 32px !important;
    height: 32px !important;
  }

  .site-header .header-icon svg {
    width: 24px !important;
    height: 24px !important;
  }

  .site-header .bag-count {
    right: -2px !important;
    top: -2px !important;
    min-width: 18px !important;
    height: 18px !important;
    font-size: 10px !important;
    border-width: 1.5px !important;
  }
}

/* =========================
   EXTRA TINY
========================= */

@media (max-width: 320px) {
  .site-header .header-inner {
    min-height: 54px !important;
  }

  .site-header .brand-center strong {
    font-size: 18px !important;
    letter-spacing: 0.035em !important;
  }

  .site-header .brand-center small {
    font-size: 7px !important;
    letter-spacing: 0.28em !important;
  }

  .site-header .header-icon {
    width: 30px !important;
    height: 30px !important;
  }

  .site-header .header-icon svg {
    width: 22px !important;
    height: 22px !important;
  }
}
</style>

<script>
  (function () {
    const cartCountEls = document.querySelectorAll(".site-header [data-cart-count]");

    function getCartCount() {
      try {
        const cart = JSON.parse(localStorage.getItem("pp_cart") || "[]");

        if (!Array.isArray(cart)) {
          return 0;
        }

        return cart.reduce(function (total, item) {
          return total + Number(item.qty || 1);
        }, 0);
      } catch (error) {
        return 0;
      }
    }

    function updateCartBadge() {
      const count = getCartCount();

      cartCountEls.forEach(function (el) {
        el.textContent = count;

        if (count > 0) {
          el.classList.remove("is-hidden");
        } else {
          el.classList.add("is-hidden");
        }
      });
    }

    updateCartBadge();

    window.addEventListener("storage", updateCartBadge);
    window.addEventListener("pp-cart-updated", updateCartBadge);
  })();
</script>
