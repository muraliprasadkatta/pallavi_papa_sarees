<section class="collection-toolbar" aria-label="Collection tools">
  <form class="collection-toolbar__form" method="get" action="{% url 'store:collections' %}">
    <input type="hidden" name="category" value="{{ active_category|default:'all' }}">
    <input type="hidden" name="sort" value="{{ active_sort|default:'newest' }}">

    <div class="collection-toolbar__top">
      <label class="toolbar-search">
        <svg class="toolbar-search__icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M10.8 18.1a7.3 7.3 0 1 1 0-14.6 7.3 7.3 0 0 1 0 14.6Zm0-2a5.3 5.3 0 1 0 0-10.6 5.3 5.3 0 0 0 0 10.6Z"/>
          <path d="M16.2 16.2 21 21"/>
        </svg>

        <input
          type="search"
          name="q"
          value="{{ search_query|default:'' }}"
          placeholder="Search sarees..."
          autocomplete="off"
        >
      </label>

      <button class="toolbar-filter" type="submit" aria-label="Filter sarees">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 7h10"/>
          <path d="M18 7h2"/>
          <path d="M16 5v4"/>
          <path d="M4 17h2"/>
          <path d="M10 17h10"/>
          <path d="M8 15v4"/>
        </svg>
        <span>Filter</span>
      </button>
    </div>

    <div class="collection-toolbar__sortbar">
      <span class="sort-label">Sort by</span>

      <a
        class="sort-chip {% if active_sort == 'newest' or not active_sort %}is-active{% endif %}"
        href="{% url 'store:collections' %}?category={{ active_category|default:'all' }}&sort=newest{% if search_query %}&q={{ search_query|urlencode }}{% endif %}"
      >
        Newest
      </a>

      <a
        class="sort-chip {% if active_sort == 'price-low' %}is-active{% endif %}"
        href="{% url 'store:collections' %}?category={{ active_category|default:'all' }}&sort=price-low{% if search_query %}&q={{ search_query|urlencode }}{% endif %}"
      >
        Price: Low to High
      </a>

      <a
        class="sort-chip {% if active_sort == 'price-high' %}is-active{% endif %}"
        href="{% url 'store:collections' %}?category={{ active_category|default:'all' }}&sort=price-high{% if search_query %}&q={{ search_query|urlencode }}{% endif %}"
      >
        Price: High to Low
      </a>

      <a
        class="sort-chip {% if active_sort == 'popular' %}is-active{% endif %}"
        href="{% url 'store:collections' %}?category={{ active_category|default:'all' }}&sort=popular{% if search_query %}&q={{ search_query|urlencode }}{% endif %}"
      >
        Popular
      </a>

      <span class="toolbar-count">{{ products|length }} items found</span>
    </div>

    {% if search_query or active_sort != "newest" %}
      <a class="toolbar-clear" href="{% url 'store:collections' %}?category={{ active_category|default:'all' }}">
        Clear
      </a>
    {% endif %}
  </form>
</section>

<style>
  .collection-toolbar,
  .collection-toolbar * {
    box-sizing: border-box;
  }

  .collection-toolbar {
    width: 100%;
    max-width: 100%;
    margin-left: 0;
    margin-right: 0;
    margin-bottom: clamp(12px, 2.5vw, 22px);
    padding: 0 clamp(14px, 3vw, 26px);
    background: #fffaf6;
  }

  .collection-toolbar__form {
    width: min(100%, 1180px);
    margin: 0 auto;
    display: grid;
    gap: 10px;
  }

  .collection-toolbar__top {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: center;
    gap: clamp(8px, 2vw, 16px);
  }

  .toolbar-search {
    min-width: 0;
    height: clamp(44px, 7vw, 54px);
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 0 clamp(13px, 2.6vw, 20px);
    border-radius: 999px;
    background: #fffdfb;
    border: 1px solid rgba(95, 16, 32, 0.14);
    box-shadow: 0 6px 16px rgba(70, 28, 35, 0.04);
  }

  .toolbar-search__icon {
    flex: 0 0 auto;
    width: clamp(17px, 3.4vw, 21px);
    height: clamp(17px, 3.4vw, 21px);
    fill: none;
    stroke: #3b252b;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .toolbar-search input {
    width: 100%;
    min-width: 0;
    height: 100%;
    border: 0;
    outline: 0;
    background: transparent;
    color: #34262b;
    font: inherit;
    font-size: clamp(13px, 3vw, 16px);
    font-weight: 600;
  }

  .toolbar-search input::placeholder {
    color: #8b8284;
    font-weight: 600;
  }

  .toolbar-search:focus-within {
    border-color: rgba(143, 23, 49, 0.28);
    box-shadow:
      0 6px 16px rgba(70, 28, 35, 0.055),
      0 0 0 3px rgba(143, 23, 49, 0.055);
  }

  .toolbar-filter {
    height: clamp(44px, 7vw, 54px);
    min-width: clamp(88px, 18vw, 126px);
    padding: 0 clamp(12px, 2.6vw, 22px);
    border-radius: 999px;
    border: 1px solid rgba(95, 16, 32, 0.14);
    background: #fffdfb;
    color: #2d2025;
    cursor: pointer;

    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;

    font: inherit;
    font-size: clamp(13px, 3vw, 16px);
    font-weight: 850;

    box-shadow: 0 6px 16px rgba(70, 28, 35, 0.04);
  }

  .toolbar-filter svg {
    width: clamp(17px, 3.4vw, 21px);
    height: clamp(17px, 3.4vw, 21px);
    fill: none;
    stroke: #5f1020;
    stroke-width: 2;
    stroke-linecap: round;
  }

  .collection-toolbar__sortbar {
    min-width: 0;
    display: flex;
    align-items: center;
    gap: clamp(10px, 2.4vw, 20px);
    padding: 0 2px 7px;
    overflow-x: auto;
    scrollbar-width: none;
    border-bottom: 1px solid rgba(95, 16, 32, 0.10);
  }

  .collection-toolbar__sortbar::-webkit-scrollbar {
    display: none;
  }

  .sort-label {
    flex: 0 0 auto;
    color: #5d5054;
    font-size: clamp(11px, 2.5vw, 14px);
    font-weight: 650;
    white-space: nowrap;
  }

  .sort-chip {
    position: relative;
    flex: 0 0 auto;
    padding: 7px 0;
    color: #423439;
    text-decoration: none;
    font-size: clamp(11px, 2.5vw, 14px);
    font-weight: 650;
    white-space: nowrap;
  }

  .sort-chip::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: -8px;
    height: 2px;
    border-radius: 999px;
    background: transparent;
  }

  .sort-chip.is-active {
    color: #8f1731;
    font-weight: 900;
  }

  .sort-chip.is-active::after {
    background: #8f1731;
  }

  .toolbar-count {
    flex: 0 0 auto;
    margin-left: auto;
    color: #8f1731;
    font-size: clamp(11px, 2.5vw, 14px);
    font-weight: 900;
    white-space: nowrap;
  }

  .toolbar-clear {
    justify-self: end;
    width: max-content;
    margin-top: -4px;
    color: #8f1731;
    text-decoration: none;
    font-size: 12px;
    font-weight: 800;
  }

  @media (max-width: 767px) {
    .collection-toolbar {
      padding-left: 12px;
      padding-right: 12px;
      margin-bottom: 12px;
    }

    .collection-toolbar__form {
      gap: 8px;
    }

    .collection-toolbar__top {
      gap: 8px;
    }

    .toolbar-search,
    .toolbar-filter {
      height: 42px;
      min-height: 42px;
    }

    .toolbar-search {
      padding-left: 13px;
      padding-right: 10px;
      gap: 7px;
    }

    .toolbar-search__icon,
    .toolbar-filter svg {
      width: 17px;
      height: 17px;
    }

    .toolbar-search input {
      font-size: 13px;
    }

    .toolbar-filter {
      min-width: 82px;
      padding-left: 11px;
      padding-right: 11px;
      gap: 6px;
      font-size: 13px;
    }

    .toolbar-filter span {
      font-size: 13px;
      line-height: 1;
    }

    .collection-toolbar__sortbar {
      gap: 14px;
      padding-bottom: 7px;
    }

    .sort-label,
    .sort-chip {
      font-size: 12px;
    }

    .toolbar-count {
      display: none;
    }
  }

  @media (max-width: 480px) {
    .collection-toolbar {
      padding-left: 10px;
      padding-right: 10px;
    }

    .collection-toolbar__top {
      gap: 8px;
      grid-template-columns: minmax(0, 1fr) auto;
    }

    .toolbar-search {
      height: 40px;
      min-height: 40px;
      padding-left: 12px;
      padding-right: 9px;
      gap: 7px;
    }

    .toolbar-filter {
      height: 40px;
      min-height: 40px;
      min-width: 76px;
      padding-left: 10px;
      padding-right: 10px;
      gap: 5px;
    }

    .toolbar-search__icon,
    .toolbar-filter svg {
      width: 16px;
      height: 16px;
    }

    .toolbar-filter span {
      font-size: 12px;
    }

    .collection-toolbar__sortbar {
      gap: 13px;
    }

    .sort-chip,
    .sort-label {
      font-size: 11.5px;
    }
  }

  @media (max-width: 360px) {
    .collection-toolbar {
      padding-left: 8px;
      padding-right: 8px;
    }

    .collection-toolbar__top {
      gap: 7px;
    }

    .toolbar-search {
      height: 38px;
      min-height: 38px;
      padding-left: 10px;
      padding-right: 8px;
    }

    .toolbar-search input {
      font-size: 12.5px;
    }

    .toolbar-filter {
      height: 38px;
      min-height: 38px;
      min-width: 68px;
      padding-left: 8px;
      padding-right: 8px;
    }

    .toolbar-filter span {
      font-size: 11px;
    }

    .toolbar-search__icon,
    .toolbar-filter svg {
      width: 15px;
      height: 15px;
    }

    .sort-chip,
    .sort-label {
      font-size: 11px;
    }
  }
</style>
