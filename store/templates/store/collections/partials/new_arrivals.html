<section class="new-arrivals" aria-label="New arrivals">

  <div class="new-arrivals__head">
    <div>
      <span class="new-arrivals__kicker">Fresh Picks</span>
      <h2>New Arrivals</h2>
    </div>

    <a href="{% url 'store:collections' %}?focus=new" class="new-arrivals__link">View all</a>
  </div>

  {% if new_arrivals %}
    <div class="new-arrivals__grid">
      {% for p in new_arrivals %}
        {% include "store/collections/partials/product_card.html" with p=p %}
      {% endfor %}
    </div>
  {% endif %}

</section>

<style>
  .new-arrivals,
  .new-arrivals * {
    box-sizing: border-box;
  }

  .new-arrivals {
    width: 100%;
    max-width: 1280px;
    margin: 0 auto;
    padding: clamp(22px, 5vw, 52px) clamp(10px, 2.6vw, 32px);
  }

  .new-arrivals__head {
    display: flex;
    align-items: end;
    justify-content: space-between;
    gap: 14px;
    margin-bottom: clamp(14px, 3vw, 24px);
    padding: clamp(12px, 3vw, 20px);
    border-radius: clamp(14px, 3vw, 22px);
    background:
      radial-gradient(circle at 96% 20%, rgba(199, 146, 67, 0.12), transparent 28%),
      linear-gradient(135deg, #fffdfb, #fff8f2);
    border: 1px solid rgba(143, 23, 49, 0.09);
    box-shadow: 0 8px 22px rgba(70, 28, 35, 0.055);
  }

  .new-arrivals__kicker {
    display: block;
    margin-bottom: 5px;
    color: #c79243;
    font-size: 11px;
    font-weight: 900;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .new-arrivals__head h2 {
    margin: 0;
    color: #4a1b25;
    font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    font-size: clamp(22px, 4.8vw, 34px);
    line-height: 1.05;
    font-weight: 700;
  }

  .new-arrivals__link {
    flex: 0 0 auto;
    color: #8f1731;
    font-size: 12px;
    font-weight: 800;
    text-decoration: none;
  }

  .new-arrivals__grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: clamp(12px, 3vw, 28px);
    align-items: stretch;
  }

  @media (min-width: 768px) {
    .new-arrivals__grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
  }

  @media (min-width: 1100px) {
    .new-arrivals__grid {
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 32px;
    }
  }

  @media (max-width: 480px) {
    .new-arrivals {
      padding-left: 10px;
      padding-right: 10px;
    }

    .new-arrivals__head {
      align-items: start;
      flex-direction: column;
    }

    .new-arrivals__grid {
      gap: 12px;
    }
  }
</style>
