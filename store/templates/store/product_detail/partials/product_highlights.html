<div class="pd-highlights">
  <h2>Highlights</h2>

  <div class="pd-highlight-grid">
    {% for highlight in product.highlights.all %}
      {% if highlight.label and highlight.value %}
        <div class="pd-highlight-item">
          <span class="pd-highlight-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M5 9h14v11H5V9Z"></path>
              <path d="M8 9V6h8v3"></path>
              <path d="M9 14l2 2 4-5"></path>
            </svg>
          </span>

          <p>
            <strong>{{ highlight.label }}:</strong> {{ highlight.value }}
          </p>
        </div>
      {% endif %}
    {% empty %}
      <div class="pd-highlight-item">
        <span class="pd-highlight-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M7 8h10l2 4-2 7H7l-2-7 2-4Z"></path>
            <path d="M9 8V6a3 3 0 0 1 6 0v2"></path>
          </svg>
        </span>

        <p><strong>Details:</strong> Product details will be updated soon.</p>
      </div>
    {% endfor %}
  </div>
</div>
