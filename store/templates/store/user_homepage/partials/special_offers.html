{% load static %}
{% url 'store:collections' as collections_url %}

<section class="special-offers-section" aria-label="Special saree offers">
  <div class="special-offers-card" data-special-offers-slider tabindex="0">

    <div class="special-offers-head">
      <svg
        class="special-offers-title-svg"
        viewBox="0 55 1200 185"
        role="img"
        aria-label="Special Offers"
      >
        <defs>
          <path id="specialOffersArcDeep" d="M 90 202 Q 600 118 1110 202"></path>
          <path id="specialOffersArcShadow" d="M 90 200 Q 600 106 1110 200"></path>
          <path id="specialOffersArcMain" d="M 90 194 Q 600 90 1110 194"></path>
        </defs>

        <text class="special-offers-title-deep">
          <textPath href="#specialOffersArcDeep" startOffset="50%" text-anchor="middle">
            SPECIAL OFFERS
          </textPath>
        </text>

        <text class="special-offers-title-shadow">
          <textPath href="#specialOffersArcShadow" startOffset="50%" text-anchor="middle">
            SPECIAL OFFERS
          </textPath>
        </text>

        <text class="special-offers-title-main">
          <textPath href="#specialOffersArcMain" startOffset="50%" text-anchor="middle">
            SPECIAL OFFERS
          </textPath>
        </text>
      </svg>
    </div>

    <div class="special-offers-stage" data-special-offers-stage>

      <article class="special-offers-slide is-active" data-special-offers-slide>
        <div class="special-offers-thumb special-offers-thumb--one">
          <img
            class="special-offers-img"
            src="{% static 'store/user_home/special_offers/free_saree_offer_900x1200.webp' %}"
            data-fallback="{% static 'store/user_home/special_offers/big_sale_900x1200.webp' %}"
            alt="Free saree offer"
            loading="lazy"
            draggable="false"
          >
          <div class="special-offers-fallback">
            <span>Special Offer</span>
            <strong>Free Saree Offer</strong>
          </div>
        </div>
      </article>

      <article class="special-offers-slide is-next" data-special-offers-slide aria-hidden="true">
        <div class="special-offers-thumb special-offers-thumb--two">
          <img
            class="special-offers-img"
            src="{% static 'store/user_home/special_offers/free_lucky_draw_900x1200.webp' %}"
            data-fallback="{% static 'store/user_home/special_offers/big_sale_900x1200.webp' %}"
            alt="Free lucky draw offer"
            loading="lazy"
            draggable="false"
          >
          <div class="special-offers-fallback">
            <span>Special Offer</span>
            <strong>Lucky Draw Gift</strong>
          </div>
        </div>
      </article>

      <article class="special-offers-slide is-prev" data-special-offers-slide aria-hidden="true">
        <div class="special-offers-thumb special-offers-thumb--three">
          <img
            class="special-offers-img"
            src="{% static 'store/user_home/special_offers/big_sale_900x1200.webp' %}"
            data-fallback="{% static 'store/user_home/special_offers/free_saree_offer_900x1200.webp' %}"
            alt="Big sale offer"
            loading="lazy"
            draggable="false"
          >
          <div class="special-offers-fallback">
            <span>Special Offer</span>
            <strong>Big Sale</strong>
          </div>
        </div>
      </article>

    </div>

    <button class="special-offers-nav special-offers-nav--prev" type="button" aria-label="Previous offer" data-special-offers-prev>
      ‹
    </button>

    <button class="special-offers-nav special-offers-nav--next" type="button" aria-label="Next offer" data-special-offers-next>
      ›
    </button>

    <div class="special-offers-dots" aria-label="Special offers slider controls">
      <button type="button" class="is-active" aria-label="Show free saree offer" aria-current="true" data-special-offers-dot></button>
      <button type="button" aria-label="Show lucky draw offer" data-special-offers-dot></button>
      <button type="button" aria-label="Show big sale offer" data-special-offers-dot></button>
    </div>

    <a href="{{ collections_url }}" class="special-offers-cta">
      Explore More Collections <span>→</span>
    </a>

  </div>
</section>

<style>

<script>
  (function () {
    const sliders = document.querySelectorAll("[data-special-offers-slider]");

    sliders.forEach(function (slider) {
      const slides = Array.from(slider.querySelectorAll("[data-special-offers-slide]"));
      const dots = Array.from(slider.querySelectorAll("[data-special-offers-dot]"));
      const prevBtn = slider.querySelector("[data-special-offers-prev]");
      const nextBtn = slider.querySelector("[data-special-offers-next]");
      const stage = slider.querySelector("[data-special-offers-stage]") || slider;
      const images = Array.from(slider.querySelectorAll(".special-offers-img"));

      if (slides.length <= 1) return;

      let currentIndex = 0;
      let timer = null;

      let pointerStartX = 0;
      let pointerStartY = 0;
      let pointerCurrentX = 0;
      let isDragging = false;
      let activePointerId = null;
      let dragStartedAt = 0;

      const AUTO_DELAY = 4200;
      const SWIPE_DISTANCE = 44;
      const SWIPE_VELOCITY_DISTANCE = 28;
      const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      images.forEach(function (img) {
        img.addEventListener("error", function () {
          const fallback = img.getAttribute("data-fallback");
          const fallbackUsed = img.getAttribute("data-fallback-used") === "1";
          const thumb = img.closest(".special-offers-thumb");

          if (fallback && !fallbackUsed) {
            img.setAttribute("data-fallback-used", "1");
            img.src = fallback;
            return;
          }

          img.hidden = true;

          if (thumb) {
            thumb.classList.add("is-fallback-only");
          }
        });
      });

      function getPosition(index) {
        const total = slides.length;
        let diff = index - currentIndex;

        if (diff > total / 2) diff -= total;
        if (diff < -total / 2) diff += total;

        return diff;
      }

      function updateSlides(shouldRestart) {
        slides.forEach(function (slide, index) {
          const pos = getPosition(index);

          slide.classList.remove("is-active", "is-prev", "is-next", "is-prev-2", "is-next-2");
          slide.setAttribute("aria-hidden", "true");

          if (pos === 0) {
            slide.classList.add("is-active");
            slide.setAttribute("aria-hidden", "false");
          } else if (pos === -1) {
            slide.classList.add("is-prev");
          } else if (pos === 1) {
            slide.classList.add("is-next");
          } else if (pos === -2) {
            slide.classList.add("is-prev-2");
          } else if (pos === 2) {
            slide.classList.add("is-next-2");
          }
        });

        dots.forEach(function (dot, index) {
          const isActive = index === currentIndex;
          dot.classList.toggle("is-active", isActive);

          if (isActive) {
            dot.setAttribute("aria-current", "true");
          } else {
            dot.removeAttribute("aria-current");
          }
        });

        if (shouldRestart) {
          restartAutoSlide();
        }
      }

      function goTo(index, shouldRestart) {
        currentIndex = (index + slides.length) % slides.length;
        updateSlides(shouldRestart);
      }

      function nextSlide(shouldRestart) {
        goTo(currentIndex + 1, shouldRestart);
      }

      function prevSlide(shouldRestart) {
        goTo(currentIndex - 1, shouldRestart);
      }

      function startAutoSlide() {
        if (prefersReducedMotion) return;

        stopAutoSlide();
        timer = window.setInterval(function () {
          nextSlide(false);
        }, AUTO_DELAY);
      }

      function stopAutoSlide() {
        if (timer) {
          window.clearInterval(timer);
          timer = null;
        }
      }

      function restartAutoSlide() {
        stopAutoSlide();
        startAutoSlide();
      }

      function startDrag(event) {
        if (event.button !== undefined && event.button !== 0) return;

        const clickedControl = event.target.closest("button, .special-offers-cta");
        if (clickedControl) return;

        isDragging = true;
        activePointerId = event.pointerId;
        pointerStartX = event.clientX;
        pointerStartY = event.clientY;
        pointerCurrentX = event.clientX;
        dragStartedAt = Date.now();

        slider.classList.add("is-dragging");
        stopAutoSlide();

        if (stage.setPointerCapture && activePointerId !== null) {
          stage.setPointerCapture(activePointerId);
        }
      }

      function moveDrag(event) {
        if (!isDragging || event.pointerId !== activePointerId) return;

        pointerCurrentX = event.clientX;

        const diffX = pointerCurrentX - pointerStartX;
        const diffY = event.clientY - pointerStartY;

        if (Math.abs(diffX) > 10 && Math.abs(diffX) > Math.abs(diffY)) {
          event.preventDefault();
        }
      }

      function endDrag(event) {
        if (!isDragging || event.pointerId !== activePointerId) return;

        const diffX = event.clientX - pointerStartX;
        const diffY = event.clientY - pointerStartY;
        const elapsed = Math.max(Date.now() - dragStartedAt, 1);

        isDragging = false;
        activePointerId = null;
        slider.classList.remove("is-dragging");

        const isHorizontalSwipe = Math.abs(diffX) > Math.abs(diffY);
        const isDistanceSwipe = Math.abs(diffX) > SWIPE_DISTANCE;
        const isFastSwipe = Math.abs(diffX) > SWIPE_VELOCITY_DISTANCE && elapsed < 260;

        if (isHorizontalSwipe && (isDistanceSwipe || isFastSwipe)) {
          if (diffX < 0) {
            nextSlide(true);
          } else {
            prevSlide(true);
          }
        } else {
          restartAutoSlide();
        }
      }

      function cancelDrag() {
        if (!isDragging) return;

        isDragging = false;
        activePointerId = null;
        slider.classList.remove("is-dragging");
        restartAutoSlide();
      }

      if (nextBtn) {
        nextBtn.addEventListener("click", function () {
          nextSlide(true);
        });
      }

      if (prevBtn) {
        prevBtn.addEventListener("click", function () {
          prevSlide(true);
        });
      }

      dots.forEach(function (dot, index) {
        dot.addEventListener("click", function () {
          goTo(index, true);
        });
      });

      slider.addEventListener("keydown", function (event) {
        if (event.key === "ArrowRight") {
          event.preventDefault();
          nextSlide(true);
        }

        if (event.key === "ArrowLeft") {
          event.preventDefault();
          prevSlide(true);
        }
      });

      stage.addEventListener("pointerdown", startDrag);
      stage.addEventListener("pointermove", moveDrag);
      stage.addEventListener("pointerup", endDrag);
      stage.addEventListener("pointercancel", cancelDrag);
      stage.addEventListener("lostpointercapture", cancelDrag);

      slider.addEventListener("mouseenter", stopAutoSlide);
      slider.addEventListener("mouseleave", function () {
        cancelDrag();
        startAutoSlide();
      });

      slider.addEventListener("focusin", stopAutoSlide);
      slider.addEventListener("focusout", startAutoSlide);

      document.addEventListener("visibilitychange", function () {
        if (document.hidden) {
          stopAutoSlide();
        } else {
          startAutoSlide();
        }
      });

      updateSlides(false);
      startAutoSlide();
    });
  })();
</script>
