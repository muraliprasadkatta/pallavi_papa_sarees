<style>
  .trending-collections-section {
    width: 100%;
    max-width: 100%;
    margin: 0;
    background:
      radial-gradient(circle at 12% 0%, rgba(199, 146, 67, 0.06), transparent 24%),
      linear-gradient(180deg, #fffaf6 0%, #fff7f1 100%);
    padding: 0 0 clamp(10px, 2.4vw, 20px);
    box-sizing: border-box;
    overflow-x: hidden;
  }

  .trending-collections-card {
    width: min(100% - clamp(6px, 2.2vw, 56px), 1680px);
    margin-inline: auto;
    background:
      linear-gradient(145deg, rgba(255, 255, 255, 0.96), rgba(255, 250, 245, 0.94));
    border: 1px solid rgba(143, 23, 49, 0.08);
    border-radius: clamp(14px, 2.8vw, 24px);
    box-shadow: 0 10px 28px rgba(80, 36, 40, 0.07);
    padding:
      clamp(8px, 1.5vw, 16px)
      0
      clamp(10px, 1.8vw, 18px);
    box-sizing: border-box;
    overflow: hidden;
  }

  .trending-collections-head {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(7px, 1.4vw, 14px);
    text-align: center;
    margin: 0 clamp(6px, 1.8vw, 18px) clamp(8px, 1.5vw, 14px);
  }

  .trending-collections-head h2 {
    margin: 0;
    color: #5f1020;
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(15px, 2.1vw, 28px);
    line-height: 1;
    letter-spacing: -0.02em;
    white-space: nowrap;
  }

  .trending-head-line {
    flex: 1;
    max-width: clamp(24px, 7vw, 92px);
    height: 1px;
    background:
      linear-gradient(90deg, transparent, rgba(199, 146, 67, 0.95), transparent);
    position: relative;
  }

  .trending-head-line::after {
    content: "";
    position: absolute;
    top: 50%;
    width: 4px;
    height: 4px;
    border-radius: 999px;
    background: #c79243;
    transform: translateY(-50%);
  }

  .trending-head-line:first-child::after {
    right: 0;
  }

  .trending-head-line:last-child::after {
    left: 0;
  }

  .trending-marquee-wrap {
    display: grid;
    gap: clamp(9px, 1.5vw, 16px);
    overflow: hidden;
  }

  .trending-row {
    width: 100%;
    max-width: 100%;
    overflow: hidden;
    position: relative;
  }

  .trending-track {
    --trend-gap: clamp(12px, 1.35vw, 20px);
    width: max-content;
    display: flex;
    align-items: center;
    gap: 0;
    will-change: transform;
  }

  .trending-set {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: var(--trend-gap);
    padding-right: var(--trend-gap);
  }

  .trending-row--left .trending-track {
    animation: trendingMoveLeft 42s linear infinite;
  }

  .trending-row--right .trending-track {
    animation: trendingMoveRight 42s linear infinite;
  }

  .trending-row:hover .trending-track {
    animation-play-state: paused;
  }

  .trending-card {
    position: relative;
    flex: 0 0 clamp(76px, 8.2vw, 128px);
    width: clamp(76px, 8.2vw, 128px);
    height: clamp(112px, 13.5vw, 190px);
    display: block;
    border-radius: clamp(10px, 1.5vw, 18px);
    overflow: hidden;
    text-decoration: none;
    border: 1px solid rgba(143, 23, 49, 0.09);
    box-shadow: 0 7px 16px rgba(80, 36, 40, 0.07);
    transform: translateZ(0);
  }

  .trending-card::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 30% 30%, rgba(255, 231, 170, 0.35), transparent 18%),
      repeating-linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.12) 0 2px,
        transparent 2px 15px
      );
    z-index: 1;
  }

  .trending-card::after {
    content: "";
    position: absolute;
    inset: 0 0 0 auto;
    width: 32%;
    background:
      linear-gradient(
        180deg,
        rgba(255, 232, 165, 0.50),
        transparent 45%,
        rgba(255, 232, 165, 0.34)
      );
    z-index: 2;
  }

  .trending-card span {
    position: absolute;
    right: clamp(-18px, -1.5vw, -8px);
    top: 50%;
    width: 68%;
    height: 78%;
    border-radius: 50%;
    border: 2px solid rgba(255, 229, 170, 0.36);
    transform: translateY(-50%) rotate(-16deg);
    z-index: 3;
  }

  .trending-card--one {
    background: linear-gradient(135deg, #a8073a, #7c1831 58%, #d29a3c);
  }

  .trending-card--two {
    background: linear-gradient(135deg, #f0d2c8, #d2828d 55%, #f4c76b);
  }

  .trending-card--three {
    background: linear-gradient(135deg, #0e6268, #16444e 58%, #c79243);
  }

  .trending-card--four {
    background: linear-gradient(135deg, #6b4da2, #7f2f6d 56%, #c69a44);
  }

  .trending-card--five {
    background: linear-gradient(135deg, #dfe6bd, #b5bd84 55%, #fff0c9);
  }

  .trending-card--six {
    background: linear-gradient(135deg, #8f1731, #c14a5c 55%, #f4c76b);
  }

  .trending-card--seven {
    background: linear-gradient(135deg, #4b102a, #9b2e52 58%, #e2a241);
  }

  .trending-card--eight {
    background: linear-gradient(135deg, #f5d8d4, #c96b7d 55%, #f2c36a);
  }

  .trending-card--nine {
    background: linear-gradient(135deg, #145c48, #0f756a 55%, #d6a94a);
  }

  .trending-card--ten {
    background: linear-gradient(135deg, #542f76, #8f3f75 55%, #d5a34d);
  }

  .trending-card--eleven {
    background: linear-gradient(135deg, #efe3b1, #c4b56d 55%, #fff0c9);
  }

  .trending-card--twelve {
    background: linear-gradient(135deg, #7c1831, #b81766 55%, #f4c76b);
  }

  .trending-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 11px 22px rgba(80, 36, 40, 0.11);
  }

  @keyframes trendingMoveLeft {
    from {
      transform: translate3d(0, 0, 0);
    }

    to {
      transform: translate3d(-50%, 0, 0);
    }
  }

  @keyframes trendingMoveRight {
    from {
      transform: translate3d(-50%, 0, 0);
    }

    to {
      transform: translate3d(0, 0, 0);
    }
  }

  @media (min-width: 1200px) {
    .trending-collections-card {
      width: min(100% - 56px, 1680px);
    }
  }

  @media (max-width: 767px) {
    .trending-collections-card {
      width: min(100% - 8px, 980px);
    }

    .trending-track {
      --trend-gap: clamp(8px, 2.2vw, 12px);
    }

    .trending-card {
      flex-basis: clamp(68px, 23vw, 104px);
      width: clamp(68px, 23vw, 104px);
      height: clamp(102px, 34vw, 156px);
    }

    .trending-row--left .trending-track,
    .trending-row--right .trending-track {
      animation-duration: 34s;
    }
  }

  @media (max-width: 480px) {
    .trending-collections-card {
      width: min(100% - 6px, 980px);
      padding-top: 7px;
      padding-bottom: 9px;
    }

    .trending-collections-head {
      margin-bottom: 7px;
    }

    .trending-head-line {
      max-width: 28px;
    }

    .trending-marquee-wrap {
      gap: 8px;
    }

    .trending-card {
      flex-basis: clamp(64px, 24vw, 92px);
      width: clamp(64px, 24vw, 92px);
      height: clamp(96px, 36vw, 138px);
      border-radius: 10px;
    }
  }

  @media (max-width: 360px) {
    .trending-collections-head h2 {
      font-size: 14.5px;
    }

    .trending-head-line {
      max-width: 18px;
    }

    .trending-card {
      flex-basis: clamp(58px, 25vw, 82px);
      width: clamp(58px, 25vw, 82px);
      height: clamp(88px, 37vw, 124px);
      border-radius: 9px;
    }

    .trending-row--left .trending-track,
    .trending-row--right .trending-track {
      animation-duration: 30s;
    }
  }

  @media (max-width: 320px) {
    .trending-head-line {
      display: none;
    }

    .trending-collections-card {
      width: min(100% - 4px, 980px);
    }

    .trending-card {
      flex-basis: 56px;
      width: 56px;
      height: 84px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .trending-row--left .trending-track,
    .trending-row--right .trending-track {
      animation: none;
    }
  }
</style>
