{% load static %}

      <div class="order-connector" aria-hidden="true"></div>

      <!-- Step 3 -->
      <div class="order-step">

<style>
  .how-to-order-section {
    width: 100%;
    max-width: 100%;
    margin-left: 0;
    margin-right: 0;
    background:
      radial-gradient(circle at 12% 0%, rgba(199, 146, 67, 0.06), transparent 24%),
      linear-gradient(180deg, #fffaf6 0%, #fff7f1 100%);
    padding: 0 0 clamp(12px, 2.6vw, 22px);
    box-sizing: border-box;
    overflow-x: hidden;
  }

  .order-card {
    width: min(100% - clamp(6px, 2.2vw, 56px), 1680px);
    margin-inline: auto;
    background:
      linear-gradient(145deg, rgba(255,255,255,0.96), rgba(255,250,245,0.94));
    border: 1px solid rgba(143, 23, 49, 0.08);
    border-radius: clamp(14px, 2.4vw, 24px);
    box-shadow: 0 10px 26px rgba(80, 36, 40, 0.07);
    padding:
      clamp(7px, 1.45vw, 16px)
      clamp(5px, 1.55vw, 18px)
      clamp(9px, 1.7vw, 18px);
    box-sizing: border-box;
  }

  .order-head {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(7px, 1.3vw, 14px);
    text-align: center;
    margin-bottom: clamp(7px, 1.35vw, 14px);
  }

  .order-head__line {
    flex: 1;
    max-width: clamp(24px, 7vw, 92px);
    height: 1px;
    background:
      linear-gradient(90deg, transparent, rgba(199, 146, 67, 0.95), transparent);
    position: relative;
  }

  .order-head__line::after {
    content: "";
    position: absolute;
    top: 50%;
    width: 4px;
    height: 4px;
    border-radius: 999px;
    background: #c79243;
    transform: translateY(-50%);
  }

  .order-head__line:first-child::after {
    right: 0;
  }

  .order-head__line:last-child::after {
    left: 0;
  }

  .order-head__center h2 {
    margin: 0;
    color: #5f1020;
    font-family: var(--font-serif);
    font-size: clamp(15px, 2.15vw, 28px);
    line-height: 1;
    letter-spacing: -0.02em;
    white-space: nowrap;
  }

  .order-head__center p {
    margin: 3px 0 0;
    color: #776f73;
    font-size: clamp(9px, 1.15vw, 14px);
    line-height: 1.2;
  }

  .order-steps {
    width: min(100%, 1180px);
    margin-inline: auto;
    display: grid;
    grid-template-columns:
      minmax(0, 1fr)
      clamp(14px, 5.5vw, 112px)
      minmax(0, 1fr)
      clamp(14px, 5.5vw, 112px)
      minmax(0, 1fr);
    align-items: start;
    gap: clamp(2px, 0.65vw, 10px);
  }

  .order-step {
    min-width: 0;
    text-align: center;
    padding: 0 clamp(1px, 0.45vw, 8px);
  }

  .order-step__top {
    display: flex;
    align-items: center;
    justify-content: center;

    /* icon size taggincham + number/icon gap pencham */
    gap: clamp(9px, 1.65vw, 22px);

    margin-bottom: clamp(4px, 0.8vw, 8px);
  }

  .order-step__num {
    width: clamp(18px, 2.35vw, 30px);
    height: clamp(18px, 2.35vw, 30px);
    flex: 0 0 auto;
    border-radius: 999px;
    background: #fff1e4;
    color: #7d3f20;
    display: grid;
    place-items: center;
    font-weight: 900;
    font-size: clamp(9px, 1.2vw, 15px);
    line-height: 1;
    box-shadow: inset 0 0 0 1px rgba(199, 146, 67, 0.20);
  }

  .order-step__icon {
    width: clamp(30px, 4.35vw, 48px);
    height: clamp(30px, 4.35vw, 48px);
    flex: 0 0 auto;
    border-radius: 999px;
    background: linear-gradient(145deg, #fff8f2, #f8efe6);
    display: grid;
    place-items: center;
    box-shadow:
      inset 0 0 0 1px rgba(143, 23, 49, 0.06),
      0 6px 14px rgba(80, 36, 40, 0.06);
  }

  .order-step__icon svg {
    width: 76%;
    height: 76%;
    display: block;
  }

  .order-step__icon--select svg {
    width: 82%;
    height: 82%;
  }

  .order-step__icon--whatsapp {
    background: #25D366;
    color: #ffffff;
  }

  .order-step__icon--whatsapp svg {
    width: 58%;
    height: 58%;
  }

  .order-step__icon--delivery svg {
    width: 76%;
    height: 76%;
  }

  .order-step h3 {
    margin: 0;
    color: #611726;
    font-size: clamp(8.4px, 1.25vw, 16px);
    line-height: 1.12;
    font-weight: 850;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }

  .order-step p {
    margin: 3px auto 0;
    color: #6f666b;
    font-size: clamp(7px, 1vw, 13px);
    line-height: 1.25;
    max-width: clamp(62px, 12vw, 190px);
    text-wrap: balance;
  }

  .order-connector {
    align-self: start;
    height: clamp(30px, 4.35vw, 48px);
    margin-top: clamp(9px, 1.45vw, 15px);
    position: relative;
  }

  .order-connector::before {
    content: "";
    position: absolute;
    left: 0;
    right: clamp(7px, 0.9vw, 14px);
    top: 50%;
    border-top: 1px dashed rgba(199, 146, 67, 0.75);
    transform: translateY(-50%);
  }

  .order-connector::after {
    content: "";
    position: absolute;
    right: 1px;
    top: 50%;
    width: clamp(5px, 0.75vw, 8px);
    height: clamp(5px, 0.75vw, 8px);
    border-top: 1.5px solid #c79243;
    border-right: 1.5px solid #c79243;
    transform: translateY(-50%) rotate(45deg);
  }

  @media (min-width: 1200px) {
    .order-card {
      width: min(100% - 56px, 1680px);
    }

    .order-steps {
      max-width: 1180px;
    }
  }

  @media (max-width: 767px) {
    .order-card {
      width: min(100% - 8px, 980px);
    }

    .order-steps {
      grid-template-columns:
        minmax(0, 1fr)
        clamp(14px, 4.5vw, 38px)
        minmax(0, 1fr)
        clamp(14px, 4.5vw, 38px)
        minmax(0, 1fr);
    }

    .order-step__top {
      gap: clamp(7px, 2.5vw, 12px);
    }

    .order-step p {
      max-width: clamp(58px, 23vw, 120px);
    }
  }

  @media (max-width: 480px) {
    .order-card {
      width: min(100% - 6px, 980px);
      padding: 7px 5px 9px;
    }

    .order-head {
      margin-bottom: 7px;
    }

    .order-head__line {
      max-width: 28px;
    }

    .order-steps {
      grid-template-columns:
        minmax(0, 1fr)
        18px
        minmax(0, 1fr)
        18px
        minmax(0, 1fr);
      gap: 2px;
    }

    .order-step__top {
      gap: 7px;
    }

    .order-step__num {
      width: 18px;
      height: 18px;
      font-size: 9px;
    }

    .order-step__icon {
      width: 30px;
      height: 30px;
    }

    .order-step h3 {
      font-size: 8.2px;
    }

    .order-step p {
      font-size: 7px;
      max-width: 68px;
      line-height: 1.18;
    }

    .order-connector {
      height: 30px;
      margin-top: 9px;
    }
  }

  @media (max-width: 360px) {
    .order-head__line {
      max-width: 20px;
    }

    .order-steps {
      grid-template-columns:
        minmax(0, 1fr)
        13px
        minmax(0, 1fr)
        13px
        minmax(0, 1fr);
    }

    .order-step__top {
      gap: 6px;
    }

    .order-step__num {
      width: 16px;
      height: 16px;
      font-size: 8.5px;
    }

    .order-step__icon {
      width: 27px;
      height: 27px;
    }

    .order-step h3 {
      font-size: 7.5px;
      line-height: 1.08;
    }

    .order-step p {
      font-size: 6.5px;
      max-width: 58px;
      line-height: 1.14;
    }

    .order-connector {
      height: 27px;
      margin-top: 8px;
    }
  }

  @media (max-width: 320px) {
    .order-head__line {
      display: none;
    }

    .order-card {
      width: min(100% - 4px, 980px);
      padding-inline: 4px;
    }

    .order-steps {
      grid-template-columns:
        minmax(0, 1fr)
        10px
        minmax(0, 1fr)
        10px
        minmax(0, 1fr);
      gap: 1px;
    }

    .order-step__top {
      gap: 5px;
    }

    .order-step__num {
      width: 15px;
      height: 15px;
      font-size: 8px;
    }

    .order-step__icon {
      width: 25px;
      height: 25px;
    }

    .order-step h3 {
      font-size: 7px;
    }

    .order-step p {
      font-size: 6.2px;
      max-width: 52px;
    }

    .order-connector {
      height: 25px;
      margin-top: 7px;
    }
  }
</style>
