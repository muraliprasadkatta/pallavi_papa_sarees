{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="theme-color"
    content="#0e7a5f"
  >

  <title>
    You Are Offline • Pallavi Papa Collections
  </title>

  <link
    rel="icon"
    href="{% static 'store/pwa/icons/icon-192.png' %}"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      padding: 24px;
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      color: #17332b;
      background:
        radial-gradient(
          circle at top,
          #effff9 0,
          #fffaf3 48%,
          #ffffff 100%
        );
    }

    .offline-card {
      width: min(100%, 430px);
      padding: 32px 24px;
      text-align: center;
      border: 1px solid rgba(14, 122, 95, 0.14);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.95);
      box-shadow:
        0 22px 55px rgba(25, 70, 57, 0.13);
    }

    .offline-icon {
      display: grid;
      place-items: center;
      width: 84px;
      height: 84px;
      margin: 0 auto 20px;
      border-radius: 24px;
      color: #ffffff;
      background:
        linear-gradient(
          145deg,
          #139774,
          #075c48
        );
      box-shadow:
        0 16px 30px rgba(14, 122, 95, 0.25);
      font-size: 38px;
    }

    h1 {
      margin: 0;
      font-size: clamp(26px, 7vw, 34px);
      line-height: 1.15;
    }

    p {
      margin: 14px auto 0;
      max-width: 330px;
      color: #60736d;
      font-size: 15px;
      line-height: 1.65;
    }

    .offline-actions {
      display: grid;
      gap: 12px;
      margin-top: 26px;
    }

    .offline-button {
      display: inline-flex;
      min-height: 50px;
      align-items: center;
      justify-content: center;
      padding: 12px 20px;
      border: 0;
      border-radius: 16px;
      text-decoration: none;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    .offline-button--primary {
      color: #ffffff;
      background:
        linear-gradient(
          135deg,
          #139774,
          #075c48
        );
      box-shadow:
        0 12px 24px rgba(14, 122, 95, 0.22);
    }

    .offline-button--secondary {
      color: #0e7a5f;
      background: #ebfaf5;
    }

    .offline-note {
      margin-top: 20px;
      font-size: 12px;
      color: #8b9994;
    }
  </style>
</head>

<body>
  <main class="offline-card">
    <div
      class="offline-icon"
      aria-hidden="true"
    >
      ◌
    </div>

    <h1>You’re offline</h1>

    <p>
      Please check your internet connection and try again
      to browse Pallavi Papa Collections.
    </p>

    <div class="offline-actions">
      <button
        type="button"
        class="offline-button offline-button--primary"
        onclick="window.location.reload()"
      >
        Try Again
      </button>

      <a
        class="offline-button offline-button--secondary"
        href="/"
      >
        Go to Home
      </a>
    </div>

    <div class="offline-note">
      Pallavi Papa Sarees Collections
    </div>
  </main>
</body>
</html>
