{% load static %}

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{% block title %}Pallavi Papa Sarees Collections{% endblock %}</title>

  {% block meta %}
    <meta name="description" content="Pallavi Papa Sarees Collections offers beautiful pattu sarees, silk sarees, cotton sarees and designer saree collections.">
    <meta name="robots" content="index, follow">

    <meta property="og:title" content="Pallavi Papa Sarees Collections">
    <meta property="og:description" content="Explore elegant pattu, silk, cotton and designer saree collections.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://pallavipapacollections.online/">

    <link rel="canonical" href="https://pallavipapacollections.online/">
  {% endblock %}

  {% block extra_css %}{% endblock %}
</head>

<body>
  <div class="page">

    {% include "store/partials/header.html" %}

    <main class="main">
      {% block content %}{% endblock %}
    </main>

  </div>

  {% block extra_js %}{% endblock %}
</body>
</html>
